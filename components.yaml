  to: prisma-data-access
  description: モックサーバー・リクエストログ・アクティビティイベントの読み書き
  technology: Prisma Client
- from: mock-server-ui
  to: hoppscotch-backend
  description: モックサーバー管理・ログ取得のためのGraphQL通信
