schema_version: '1'
version: '10'
model:
  type: c4
components:
- id: hoppscotch
  name: Hoppscotch
  level: system
  description: REST/GraphQL/WebSocket等のAPI開発・テストを行うクライアントとそれを支えるバックエンド・管理機能からなるオープンソースAPI開発エコシステム
  tags:
  - internal
- id: webapp-server
  name: Webapp Update Server
  level: container
  description: デスクトップアプリ向けの署名付きWebappバンドル（ZIP+zstd, BLAKE3ハッシュ, ED25519署名）をビルド・配信する自己更新用サーバー。マニフェスト/バンドルダウンロード/公開鍵エンドポイントを提供
    (旧Rust実装からGoへ移行)
  parent: hoppscotch
  technology: Go
- id: github-oauth
  name: GitHub OAuth
  level: system
  description: GitHubアカウントによるユーザー認証を提供する外部OAuthプロバイダー
  tags:
  - external
- id: google-oauth
  name: Google OAuth
  level: system
  description: Googleアカウントによるユーザー認証を提供する外部OAuthプロバイダー
  tags:
  - external
- id: microsoft-oauth
  name: Microsoft OAuth
  level: system
  description: Microsoftアカウントによるユーザー認証を提供する外部OAuthプロバイダー
  tags:
  - external
- id: smtp-server
  name: SMTP Mail Server
  level: system
  description: 確認メールやパスワードレスログイン用のメールを送信する外部メールサーバー
  tags:
  - external
- id: posthog
  name: PostHog Analytics
  level: system
  description: アプリケーションの利用状況イベントを収集する外部プロダクト分析SaaS
  tags:
  - external
- id: hoppscotch-proxy
  name: Hoppscotch Proxy Server
  level: system
  description: CORS制約を回避するためクライアントのAPIリクエストを中継する公式プロキシサーバー（別リポジトリで提供）
  tags:
  - external
- id: hoppscotch-common
  name: Hoppscotch Common Core
  level: container
  parent: hoppscotch
  technology: Vue 3 + TypeScript, dioc, RxJS
  description: REST/GraphQL/リアルタイム通信・コレクション管理・スクリプト実行など各クライアントアプリに共通するコアロジックを提供する共有パッケージ
  tags:
  - frontend
  - library
- id: mock-server-ui
  name: Mock Server UI
  level: component
  description: コレクションに基づきモックサーバーを作成・編集・管理し、リクエストログを表示するUIコンポーネント・ストア・composable群
  parent: hoppscotch-common
  technology: Vue 3, TypeScript, urql
- id: documentation-ui
  name: Documentation UI
  level: component
  description: コレクション・リクエストのドキュメント作成/編集/プレビュー、Markdown編集、公開ドキュメントの閲覧・共有URL発行を行うUIコンポーネント・サービス・composable群
  parent: hoppscotch-common
  technology: Vue 3, TypeScript, urql, Web Worker
- id: desktop-settings-ui
  name: Desktop Settings UI
  level: component
  description: デスクトップアプリ向け設定（自動更新チェックの有効/無効、手動アップデートチェックボタンなど）を提供するUI・composable・共有スキーマ群。デスクトッププラットフォームでのみ表示される設定セクションとしてadditionalSettingsSections経由で登録される
  parent: hoppscotch-common
  technology: Vue 3, TypeScript, Zod
- id: hoppscotch-selfhost-web
  name: Hoppscotch Web App
  level: container
  parent: hoppscotch
  technology: Vue 3 + Vite, Caddy配信
  description: ブラウザ上で動作するセルフホスト版Hoppscotch Webアプリケーション
  tags:
  - frontend
- id: hoppscotch-selfhost-desktop
  name: Hoppscotch Desktop App
  level: container
  parent: hoppscotch
  technology: Tauri (Vue 3 + Rust)
  description: デスクトップ向けに配布されるHoppscotchクライアントアプリケーション
  tags:
  - frontend
  - desktop
- id: hoppscotch-agent
  name: Hoppscotch Agent
  level: container
  parent: hoppscotch
  technology: Tauri (Vue 3 + Rust, axum)
  description: 証明書・プロキシ設定など高度なリクエスト処理をローカルで代行するデスクトップ常駐エージェントアプリ
  tags:
  - desktop
- id: hoppscotch-sh-admin
  name: Hoppscotch SH Admin Dashboard
  level: container
  parent: hoppscotch
  technology: Vue 3 + Vite
  description: ユーザー・チーム・インフラ設定を管理するセルフホスト向け管理者ダッシュボード
  tags:
  - frontend
- id: hoppscotch-backend
  name: Hoppscotch Backend API
  level: container
  parent: hoppscotch
  technology: NestJS, Apollo GraphQL + REST
  description: 認証・ユーザー/チーム管理・コレクション同期などを提供するバックエンドAPIサーバー
  tags:
  - backend
- id: sort-module
  name: Sort Module
  level: component
  description: ユーザー・チームのコレクションおよびリクエストの並び替え（タイトル昇順/降順）を行い、ソートイベントをPub/Sub経由で通知するモジュール
  parent: hoppscotch-backend
  technology: NestJS, GraphQL
- id: mock-server-module
  name: Mock Server Module
  level: component
  description: コレクションの例データを基にモックサーバーを作成・更新・削除し、リクエストのハンドリング・ログ記録・利用状況分析を行うモジュール（Personal/Teamワークスペース対応、公開/PAT認証の非公開サーバーをサポート）
  parent: hoppscotch-backend
  technology: NestJS, GraphQL, REST
- id: published-docs-module
  name: Published Docs Module
  level: component
  description: コレクション/リクエストのドキュメントを公開URLとして発行・更新・削除・閲覧する機能を提供するモジュール（Personal/Teamワークスペース対応）
  parent: hoppscotch-backend
  technology: NestJS, GraphQL, REST
- id: hoppscotch-cli
  name: Hoppscotch CLI
  level: container
  parent: hoppscotch
  technology: Node.js, Commander
  description: CI環境でHoppscotchのコレクション・テストスクリプトを実行するコマンドラインツール
  tags:
  - cli
- id: hoppscotch-db
  name: Hoppscotch Database
  level: container
  parent: hoppscotch
  technology: PostgreSQL 15
  description: ユーザー・チーム・コレクション等のアプリケーションデータを永続化するリレーショナルデータベース
  tags:
  - datastore
- id: hoppscotch-redis
  name: Hoppscotch Redis
  level: container
  parent: hoppscotch
  technology: Redis
  description: GraphQL Subscriptionsのメッセージ配信に用いるPub/Subストア
  tags:
  - datastore
- id: rest-client
  name: REST Client
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: HTTPメソッド・ヘッダー・ボディを組み立ててREST APIリクエストを送受信するコア機能
- id: graphql-client
  name: GraphQL Client
  level: component
  parent: hoppscotch-common
  technology: urql, graphql-language-service
  description: GraphQLスキーマ取得・クエリ実行・ドキュメント表示を行うクライアント機能
- id: realtime-protocols
  name: Realtime Protocol Clients
  level: component
  parent: hoppscotch-common
  technology: Socket.IO/MQTT/SSE/WebSocket
  description: WebSocket・SSE・Socket.IO・MQTTによるリアルタイム通信クライアント機能
- id: collections-environments
  name: Collections & Environments
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: リクエストコレクションおよび環境変数の管理・永続化を行う機能
- id: interceptors
  name: Request Interceptors
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: ブラウザ標準・プロキシ・拡張機能・ローカルエージェント経由などリクエスト送出方式を切り替えるインターセプター群
- id: inspection-services
  name: Inspection Services
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: リクエスト送信前後のヘッダー・環境変数・レスポンスを検査するサービス
- id: scripting-integration
  name: Scripting Integration
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: Pre-requestおよびTestスクリプトをJSサンドボックスで実行する統合機能
- id: platform-abstraction
  name: Platform Abstraction Layer
  level: component
  parent: hoppscotch-common
  technology: TypeScript
  description: 認証・保存先・設定等をプラットフォームごとに差し替え可能にする抽象化レイヤー
- id: web-platform-adapters
  name: Web Platform Adapters
  level: component
  parent: hoppscotch-selfhost-web
  technology: TypeScript
  description: ブラウザ環境向けに認証・環境・コレクション・履歴・設定のプラットフォーム実装を提供するアダプター
- id: web-backend-gql-client
  name: Web Backend GraphQL Client
  level: component
  parent: hoppscotch-selfhost-web
  technology: urql
  description: バックエンドのGraphQL APIと通信するクライアント設定
- id: web-extension-interceptor
  name: Extension Interceptor Integration
  level: component
  parent: hoppscotch-selfhost-web
  technology: TypeScript
  description: ブラウザ拡張機能経由でリクエストを送信するインターセプター連携
- id: web-pwa-shell
  name: PWA Shell
  level: component
  parent: hoppscotch-selfhost-web
  technology: Workbox
  description: Service WorkerによるPWA化・オフライン対応を行うアプリシェル
- id: desktop-platform-adapters
  name: Desktop Platform Adapters
  level: component
  parent: hoppscotch-selfhost-desktop
  technology: TypeScript
  description: Tauri環境向けに認証・環境・コレクション・履歴・設定のプラットフォーム実装を提供するアダプター
- id: desktop-native-interceptor
  name: Native Interceptor
  level: component
  parent: hoppscotch-selfhost-desktop
  technology: TypeScript + Tauri IPC
  description: Tauri/Rustバックエンドを介してネイティブにHTTPリクエストを実行するインターセプター
- id: desktop-tauri-shell
  name: Desktop Tauri Shell
  level: component
  parent: hoppscotch-selfhost-desktop
  technology: Rust (Tauri)
  description: ウィンドウ管理・OS統合・hoppscotch-relayクレートによるリクエスト実行を担うネイティブバックエンド
- id: desktop-backend-gql-client
  name: Desktop Backend GraphQL Client
  level: component
  parent: hoppscotch-selfhost-desktop
  technology: urql
  description: バックエンドのGraphQL APIと通信するクライアント設定
- id: agent-ui
  name: Agent UI
  level: component
  parent: hoppscotch-agent
  technology: Vue 3
  description: ペアリングやステータス表示を行うエージェントのウィンドウUI
- id: agent-controller
  name: Agent HTTP Controller
  level: component
  parent: hoppscotch-agent
  technology: Rust (axum)
  description: リクエスト実行・ペアリング登録・認証処理を公開するHTTPコントローラー
- id: agent-relay-engine
  name: Agent Relay Engine
  level: component
  parent: hoppscotch-agent
  technology: Rust (hoppscotch-relay, curl)
  description: 証明書・プロキシ設定を含む実際のHTTPリクエストをhoppscotch-relayクレートで実行するエンジン
- id: agent-state
  name: Agent Registration State
  level: component
  parent: hoppscotch-agent
  technology: Rust
  description: ペアリング済みクライアントの登録情報・セッションを管理するステート
- id: admin-dashboard-ui
  name: Admin Dashboard UI
  level: component
  parent: hoppscotch-sh-admin
  technology: Vue 3
  description: ユーザー・チーム・インフラ設定を操作する管理画面UI
- id: admin-gql-client
  name: Admin GraphQL Client
  level: component
  parent: hoppscotch-sh-admin
  technology: urql + exchange-auth
  description: 認証付きでバックエンドGraphQL APIへアクセスするクライアント
- id: admin-auth
  name: Admin Auth Helper
  level: component
  parent: hoppscotch-sh-admin
  technology: TypeScript
  description: 管理者ログイン・認可処理を行う認証ヘルパー
- id: graphql-api
  name: GraphQL API Layer
  level: component
  parent: hoppscotch-backend
  technology: NestJS + Apollo Server
  description: クエリ・ミューテーション・サブスクリプションを提供するGraphQL API層
- id: rest-api
  name: REST API Controllers
  level: component
  parent: hoppscotch-backend
  technology: NestJS + Swagger
  description: インフラトークン管理等をREST/Swaggerで公開するコントローラー群
- id: auth-module
  name: Auth Module
  level: component
  parent: hoppscotch-backend
  technology: Passport, JWT
  description: ローカル・JWTおよびGitHub/Google/MicrosoftのOAuthによる認証戦略を実装するモジュール
- id: user-team-management
  name: User & Team Management
  level: component
  parent: hoppscotch-backend
  technology: NestJS
  description: ユーザー・チーム・ワークスペースのドメインロジックを扱うモジュール
- id: mailer-service
  name: Mailer Service
  level: component
  parent: hoppscotch-backend
  technology: nodemailer, Handlebars
  description: 確認メールやログイン用メールを送信するメーラーサービス
- id: prisma-data-access
  name: Prisma Data Access
  level: component
  parent: hoppscotch-backend
  technology: Prisma ORM
  description: PrismaによるPostgreSQLへのデータアクセス層
- id: analytics-service
  name: Analytics Service
  level: component
  parent: hoppscotch-backend
  technology: posthog-node
  description: PostHogへ利用状況イベントを送信する分析サービス
- id: subscriptions-pubsub
  name: Subscriptions Pub/Sub
  level: component
  parent: hoppscotch-backend
  technology: graphql-redis-subscriptions
  description: GraphQL SubscriptionsのメッセージをRedis経由で配信するモジュール
- id: cli-commands
  name: CLI Command Parser
  level: component
  parent: hoppscotch-cli
  technology: Commander
  description: testコマンド等のCLI引数を解釈するエントリポイント
- id: collection-runner
  name: Collection Runner
  level: component
  parent: hoppscotch-cli
  technology: axios, fp-ts
  description: コレクションJSONを読み込み、各リクエストを順次実行するランナー
- id: cli-script-sandbox
  name: CLI Script Sandbox
  level: component
  parent: hoppscotch-cli
  technology: isolated-vm
  description: Pre-request/Testスクリプトをサンドボックス内で実行する機能
- id: report-generator
  name: Report Generator
  level: component
  parent: hoppscotch-cli
  technology: chalk
  description: テスト結果を集計しCLI出力・終了コードを生成するレポーター
- id: esm-sh-cdn
  name: esm.sh CDN
  level: system
  description: ES moduleのTypeScript型定義(.d.ts)を提供する外部CDN。Monacoエディタのスクリプト編集時のIntelliSense/型取得に利用される
  technology: CDN (HTTPS)
- id: webview2-cdn
  name: Microsoft WebView2 Runtime CDN
  level: system
  description: Windows向けWebView2 Runtimeのブートストラップインストーラーを配布する外部CDN。ポータブルモードでWebView2未インストール時に利用される
  technology: CDN (HTTPS)
